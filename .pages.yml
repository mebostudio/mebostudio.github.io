# Pages CMS (https://app.pagescms.org) — 網站內容編輯設定
media:
  input: src/assets/images
  output: /assets/images

content:
  - name: projects
    label: 作品集
    type: collection
    path: src/projects
    format: yaml-frontmatter
    view:
      fields: [title, category, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - { name: title, label: 作品名稱, type: string, required: true }
      - name: category
        label: 分類
        type: select
        options:
          values: [Brand Identity, Art Direction, Key Visual, Poster, Editorial, Show Packaging, Character]
      - { name: cover, label: 封面圖（4:5 直式）, type: image }
      - { name: order, label: 排列順序（數字小的在前）, type: number }
      - { name: client, label: CLIENT 客戶, type: string }
      - { name: year, label: YEAR 年份, type: string }
      - { name: role, label: ROLE 負責角色（例：Creative Direction, Art Direction）, type: string }
      - { name: hero, label: 內頁主視覺（橫式大圖，選填）, type: image }
      - { name: brief, label: 01 BRIEF / CONTEXT｜這個專案原本需要解決什麼？（50–150 字）, type: text }
      - { name: brief_en, label: 01 BRIEF｜英文版（外國訪客會看到；留空則顯示中文）, type: text }
      - { name: perspective, label: 02 PERSPECTIVE / IDEA｜我怎麼理解這個問題、找到什麼核心觀點？, type: text }
      - { name: perspective_en, label: 02 PERSPECTIVE｜英文版（外國訪客會看到；留空則顯示中文）, type: text }
      - { name: direction, label: 03 CREATIVE DIRECTION｜觀點如何變成視覺方向、系統、攝影、字體、色彩或製作？, type: text }
      - { name: direction_en, label: 03 CREATIVE DIRECTION｜英文版（外國訪客會看到；留空則顯示中文）, type: text }
      - { name: outcome, label: 04 OUTCOME｜最後如何被實際應用？, type: text }
      - { name: outcome_en, label: 04 OUTCOME｜英文版（外國訪客會看到；留空則顯示中文）, type: text }
      - name: gallery
        label: 作品圖片
        type: object
        list: true
        fields:
          - { name: image, label: 圖片, type: image }
          - name: size
            label: 版型
            type: select
            default: wide
            options:
              values:
                - { value: wide, label: 滿版 }
                - { value: half, label: 半版（兩張並排） }
                - { value: portrait, label: 直式＋說明 }
          - { name: caption, label: 圖說（選填）, type: string }
      - name: credits
        label: CREDITS
        type: object
        list: true
        fields:
          - { name: role, label: 職稱, type: string }
          - { name: name, label: 名字, type: string }
      - { name: draft, label: 草稿（勾選則不顯示在網站）, type: boolean }
      - { name: body, label: 補充內容（選填）, type: rich-text }

  - name: journal
    label: 設計筆記（文章）
    type: collection
    path: src/journal
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      fields: [title, date, category, draft]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: 標題, type: string, required: true }
      - { name: slug, label: 網址代稱（英文小寫與連字號，例：my-first-post）, type: string, required: true, hidden: false }
      - { name: date, label: 發布日期, type: date }
      - name: category
        label: 分類
        type: select
        options:
          values: [工作室筆記, 品牌結構, 視覺思考, 設計實務]
      - { name: excerpt, label: 摘要, type: text }
      - { name: cover, label: 封面圖（選填，沒放會顯示海浪漸層）, type: image }
      - { name: keywords, label: 標籤（以逗號分隔）, type: string }
      - { name: draft, label: 草稿（勾選則不顯示在網站）, type: boolean }
      - { name: body, label: 內文, type: rich-text }

  # ───────────── 頁面文字（網頁上由上到下的順序） ─────────────
  - name: page-home
    label: 頁面文字｜首頁
    type: file
    path: src/_data/home.json
    format: json
    fields:
      - { name: intro_en, label: ① 工作室介紹｜英文主句, type: text }
      - { name: intro_zh, label: ① 工作室介紹｜中文, type: text }
      - { name: intro_note, label: ① 工作室介紹｜小字（理念一句話）, type: string }
      - name: services
        label: ② 服務 SERVICE｜三項服務（編號自動產生）
        type: object
        list: true
        fields:
          - { name: en, label: 英文名稱, type: string }
          - { name: zh, label: 中文名稱, type: string }
          - { name: desc, label: 一句說明, type: string }
      - { name: contact_1, label: ③ 聯絡 CONTACT｜大字第一行, type: string }
      - { name: contact_2, label: ③ 聯絡｜大字第二行, type: string }

  - name: page-about
    label: 頁面文字｜About
    type: file
    path: src/_data/about.json
    format: json
    fields:
      - { name: title, label: ① 頁面大標, type: string }
      - { name: philosophy_title_1, label: ② 理念 PHILOSOPHY｜大標第一行, type: string }
      - { name: philosophy_title_2, label: ② 理念｜大標第二行, type: string }
      - { name: philosophy_lead, label: ② 理念｜副標, type: string }
      - { name: philosophy_body, label: ② 理念｜內文段落（每格一段）, type: text, list: true }
      - { name: founder_name, label: ③ 創辦人｜名字, type: string }
      - { name: founder_role, label: ③ 創辦人｜職稱, type: string }
      - { name: founder_text, label: ③ 創辦人｜介紹段落（每格一段）, type: text, list: true }
      - name: cofounded
        label: ③ 創辦人｜CO-FOUNDER
        type: object
        list: true
        fields:
          - { name: name, label: 名稱, type: string }
          - { name: desc, label: 說明, type: string }
          - { name: link, label: 連結（選填）, type: string }
      - name: founder_selected
        label: ③ 創辦人｜SELECTED EXPERIENCE 部分經歷
        type: object
        list: true
        fields:
          - { name: name, label: 名稱, type: string }
          - { name: desc, label: 說明, type: string }
      - name: experience
        label: ④ 精選經歷 SELECTED EXPERIENCE
        type: object
        list: true
        fields:
          - { name: year, label: 年份（可留空）, type: string }
          - { name: role, label: 角色（例：Creative Direction）, type: string }
          - { name: text, label: 內容, type: string }
          - { name: link, label: 連結（選填，作品頁可填 /projects/作品代稱/）, type: string }
      - name: domain
        label: ⑤ 工作範圍 WHAT WE DO
        type: object
        list: true
        fields:
          - { name: en, label: 英文名稱, type: string }
          - { name: zh, label: 中文名稱, type: string }
          - { name: desc, label: 說明, type: text }
          - { name: points, label: 項目（每格一項）, type: string, list: true }
      - name: talks
        label: ⑦ 講座・教學 TALKS / EDUCATION
        type: object
        list: true
        fields:
          - { name: year, label: 年份, type: string }
          - { name: type, label: 類別（例：LECTURE / TALK / INTERVIEW）, type: string }
          - { name: text, label: 內容, type: string }
          - { name: link, label: 連結（選填）, type: string }
      - { name: contact_1, label: ⑧ 頁尾聯絡大字第一行, type: string }
      - { name: contact_2, label: ⑧ 頁尾聯絡大字第二行, type: string }

  - name: page-service
    label: 頁面文字｜Service
    type: file
    path: src/_data/service.json
    format: json
    fields:
      - { name: title, label: ① 頁面大標, type: string }
      - { name: lead, label: ① 頁面說明, type: text }
      - name: services
        label: ② 服務項目（編號自動產生）
        type: object
        list: true
        fields:
          - { name: name_en, label: 英文名稱（大寫）, type: string }
          - { name: name_zh, label: 中文名稱, type: string }
          - { name: image, label: 圖片（4:3）, type: image }
          - { name: headline, label: 標語, type: string }
          - { name: body, label: 說明, type: text }
          - { name: deliverables, label: DELIVERABLES 交付項目（每格一項）, type: string, list: true }
          - { name: cases, label: CASE 案例（以頓號分隔）, type: string }
      - name: engagement
        label: ④ 合作方式 WORK WITH MEBO
        type: object
        list: true
        fields:
          - { name: name, label: 中文名稱, type: string }
          - { name: en, label: 英文, type: string }
          - { name: desc, label: 說明, type: text }
      - name: faq
        label: ⑤ 常見問題 FAQ（回答留空的題目不會顯示）
        type: object
        list: true
        fields:
          - { name: q, label: 問題, type: string }
          - { name: a, label: 回答, type: text }
      - { name: contact_1, label: ⑥ 頁尾聯絡大字第一行, type: string }
      - { name: contact_2, label: ⑥ 頁尾聯絡大字第二行, type: string }

  - name: page-process
    label: 頁面文字｜合作流程（About 與 Service 共用）
    type: file
    path: src/_data/process.json
    format: json
    fields:
      - { name: intro, label: 流程說明（一句話）, type: text }
      - name: steps
        label: 步驟（編號自動產生；About 與 Service 共用）
        type: object
        list: true
        fields:
          - { name: en, label: 英文（例：TALK）, type: string }
          - { name: zh, label: 中文（例：對話）, type: string }
          - { name: desc, label: 一句說明, type: string }

  - name: news
    label: 最新消息
    type: file
    path: src/_data/news.json
    format: json
    fields:
      - name: items
        label: 消息（最上面的會排第一）
        type: object
        list: true
        fields:
          - { name: date, label: 顯示日期（例：2026.11）, type: string }
          - { name: label, label: 類別（例：STUDIO / PROJECT）, type: string }
          - { name: text, label: 內容, type: string }
          - { name: link, label: 連結（選填）, type: string }

  - name: settings
    label: 網站設定
    type: file
    path: src/_data/settings.json
    format: json
    fields:
      - { name: site_title, label: 網站名稱, type: string }
      - { name: description, label: 網站描述（搜尋結果顯示）, type: text }
      - { name: kv_line1, label: 首頁標語第一行, type: string }
      - { name: kv_line2, label: 首頁標語第二行, type: string }
      - { name: email, label: Email, type: string }
      - { name: contact_url, label: 「Contact form」連結（留空＝寄信）, type: string }
      - { name: instagram_url, label: Instagram 網址, type: string }
      - { name: instagram_handle, label: Instagram 顯示文字, type: string }
      - { name: portrait, label: 創辦人照片, type: image }
      - { name: journal_intro, label: 設計筆記頁的介紹文字, type: text }
