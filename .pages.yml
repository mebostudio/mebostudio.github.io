# Pages CMS (https://app.pagescms.org) — 網站內容編輯設定
media:
  input: src/uploads
  output: /uploads

content:
  - name: projects
    label: 作品集
    type: collection
    path: src/projects
    format: yaml-frontmatter
    view:
      fields: [title, category, order]
      primary: title
      sort: [order, title]
    fields:
      - { name: title, label: 作品名稱, type: string, required: true }
      - name: category
        label: 分類
        type: select
        options:
          values: [Brand Identity, Art Direction, Key Visual, Poster, Editorial, Show Packaging, Character]
      - { name: cover, label: 封面圖（4:5 直式）, type: image }
      - { name: order, label: 排列順序（數字小的在前）, type: number }
      - { name: year, label: 年份, type: string }
      - { name: disciplines, label: 服務項目（以逗號分隔）, type: string }
      - { name: hero, label: 內頁主視覺（橫式大圖，選填）, type: image }
      - { name: overview, label: OVERVIEW 專案介紹, type: text }
      - { name: overview_en, label: OVERVIEW 英文（選填）, type: text }
      - { name: approach, label: APPROACH 設計策略（選填）, type: text }
      - { name: approach_en, label: APPROACH 英文（選填）, type: text }
      - name: gallery
        label: 作品圖片
        type: object
        list: true
        fields:
          - { name: image, label: 圖片, type: image }
          - name: size
            label: 版型
            type: select
            default: wide
            options:
              values:
                - { value: wide, label: 滿版 }
                - { value: half, label: 半版（兩張並排） }
                - { value: portrait, label: 直式＋說明 }
          - { name: caption, label: 圖說（選填）, type: string }
      - name: credits
        label: CREDITS
        type: object
        list: true
        fields:
          - { name: role, label: 職稱, type: string }
          - { name: name, label: 名字, type: string }
      - { name: draft, label: 草稿（勾選則不顯示在網站）, type: boolean }
      - { name: body, label: 補充內容（選填）, type: rich-text }

  - name: journal
    label: 設計筆記（文章）
    type: collection
    path: src/journal
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    view:
      fields: [title, date, category, draft]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: 標題, type: string, required: true }
      - { name: slug, label: 網址代稱（英文小寫與連字號，例：my-first-post）, type: string, required: true, hidden: false }
      - { name: date, label: 發布日期, type: date }
      - name: category
        label: 分類
        type: select
        options:
          values: [工作室筆記, 品牌結構, 視覺思考, 設計實務]
      - { name: excerpt, label: 摘要, type: text }
      - { name: cover, label: 封面圖（選填，沒放會顯示海浪漸層）, type: image }
      - { name: keywords, label: 標籤（以逗號分隔）, type: string }
      - { name: draft, label: 草稿（勾選則不顯示在網站）, type: boolean }
      - { name: body, label: 內文, type: rich-text }

  - name: news
    label: 最新消息
    type: file
    path: src/_data/news.json
    format: json
    fields:
      - name: items
        label: 消息（最上面的會排第一）
        type: object
        list: true
        fields:
          - { name: date, label: 顯示日期（例：2026.11）, type: string }
          - { name: label, label: 類別（例：STUDIO / PROJECT）, type: string }
          - { name: text, label: 內容, type: string }
          - { name: link, label: 連結（選填）, type: string }

  - name: settings
    label: 網站設定
    type: file
    path: src/_data/settings.json
    format: json
    fields:
      - { name: site_title, label: 網站名稱, type: string }
      - { name: description, label: 網站描述（搜尋結果顯示）, type: text }
      - { name: kv_line1, label: 首頁標語第一行, type: string }
      - { name: kv_line2, label: 首頁標語第二行, type: string }
      - { name: email, label: Email, type: string }
      - { name: contact_url, label: 「Contact form」連結（留空＝寄信）, type: string }
      - { name: instagram_url, label: Instagram 網址, type: string }
      - { name: instagram_handle, label: Instagram 顯示文字, type: string }
      - { name: portrait, label: 創辦人照片, type: image }
